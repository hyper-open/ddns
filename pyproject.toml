[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddns"
version = "0.1.0"
description = "通用 DDNS 工具：周期探测公网 IP 并同步到腾讯云/阿里云/Cloudflare/华为云 DNS"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tencent    = ["tencentcloud-sdk-python>=3.0.1000"]
aliyun     = ["alibabacloud_alidns20150109>=3.0.0", "alibabacloud_tea_openapi>=0.3.0"]
cloudflare = []
huawei     = ["huaweicloudsdkdns>=3.0.0", "huaweicloudsdkcore>=3.0.0"]
all = [
    "tencentcloud-sdk-python>=3.0.1000",
    "alibabacloud_alidns20150109>=3.0.0",
    "alibabacloud_tea_openapi>=0.3.0",
    "huaweicloudsdkdns>=3.0.0",
    "huaweicloudsdkcore>=3.0.0",
]
dev = ["pytest>=7"]

[project.scripts]
ddns = "ddns.cli:main"

[tool.setuptools]
packages = ["ddns", "ddns.providers"]
